# Scheduled notifier run. Copy this file to .github/workflows/notifier.yml.
#
# Commit notifier.yaml (environment references only, no secrets) and store
# the webhook URLs and the bot token in GitHub Actions secrets. The job
# posts what is due, then commits .notifier/state.json so the next run is
# idempotent. Nothing in this workflow calls a model.
#
# This workflow has no `push` trigger, so the state commit does not start
# another notifier run. A workflow that runs on push (such as CI) will see
# that commit.
#
# .gitignore ignores .notifier/, so the state file is force-added. The lock
# file is not committed. State holds ids and timestamps, not URLs or tokens.
# A run that posts nothing does not create state.json and does not commit.

name: notifier

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notifier-${{ github.repository }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: notifier run --config notifier.yaml
        env:
          NOTIFIER_DISCORD_URL: ${{ secrets.NOTIFIER_DISCORD_URL }}
          NOTIFIER_DISCORD_TOKEN: ${{ secrets.NOTIFIER_DISCORD_TOKEN }}
          NOTIFIER_DISCORD_CHANNEL: ${{ secrets.NOTIFIER_DISCORD_CHANNEL }}
          NOTIFIER_SLACK_URL: ${{ secrets.NOTIFIER_SLACK_URL }}
          NOTIFIER_WEBHOOK_URL: ${{ secrets.NOTIFIER_WEBHOOK_URL }}
          NOTIFIER_WEBHOOK_TOKEN: ${{ secrets.NOTIFIER_WEBHOOK_TOKEN }}
      - name: Commit state
        run: |
          if [ ! -f .notifier/state.json ]; then
            echo "no state file"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .notifier/state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "Update notifier state"
          # checkout leaves a detached HEAD; push the new commit onto the
          # branch that triggered the run (the default branch for schedule).
          git push origin "HEAD:${GITHUB_REF_NAME}"
