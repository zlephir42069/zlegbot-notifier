[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zlegbot-notifier"
version = "0.1.0"
description = "Deterministic scheduled announcements for cron and GitHub Actions."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "zlephir42069"}]
keywords = ["announcements", "automation", "cron", "discord", "slack", "webhook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/zlephir42069/zlegbot-notifier"

[project.scripts]
notifier = "notifier.cli:main"

[tool.setuptools.packages.find]
include = ["notifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
